# Alembic configuration.
#
# The database URL is deliberately NOT set here. It is read from the
# HCC_DATABASE_URL environment variable by alembic/env.py, so that no
# credentials are ever committed to the repository.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, slugged revision filenames sort chronologically and read as a
# history, unlike bare hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
