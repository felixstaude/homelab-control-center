[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hcc-server"
version = "0.1.0"
description = "Homelab Control Center — control plane API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }

# Dependencies are pinned to compatible-release ranges (~=) so patch and minor
# security updates flow in, while a major bump stays an explicit decision.
# The exact resolved set for reproducible installs lives in requirements.lock.
dependencies = [
  # Argon2id password hashing. The reference Python binding to the official
  # Argon2 C implementation; actively maintained. Chosen over passlib, whose
  # last release was 2020. See ADR-025.
  "argon2-cffi~=25.1",
  # Ed25519 verification for signed release metadata. The controller verifies
  # the signature it serves so the interface can report whether the metadata
  # is authentic; the *agent* is the party whose verification is load-bearing,
  # and it uses Go's standard library. See hcc/updates/signing.py.
  #
  # A wider range than the others on purpose: this library's majors are
  # frequent and almost always confined to backend and platform support, and
  # the two calls used here — Ed25519 sign and verify — have been stable since
  # 2.0. Pinning it to one major would mean a dependency bump every few months
  # for an API that does not move.
  "cryptography>=43,<47",
  "fastapi~=0.143",
  "uvicorn[standard]~=0.38",
  "pydantic~=2.14",
  "pydantic-settings~=2.12",
  "sqlalchemy[asyncio]~=2.0",
  "asyncpg~=0.30",
  "alembic~=1.16",
  "structlog~=25.4",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.4",
  "pytest-asyncio~=1.2",
  "httpx~=0.28",
  "ruff~=0.14",
  "mypy~=1.18",
]

[project.urls]
Homepage = "https://github.com/felixstaude/homelab-control-center"

# Operator commands. `hcc bootstrap-admin` creates the initial administrator;
# see hcc/cli/bootstrap.py for why that is a local command rather than an HTTP
# endpoint.
[project.scripts]
hcc = "hcc.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["hcc"]

# ----------------------------------------------------------------------------
# Ruff — linter and formatter (replaces Black + isort + Flake8; see ADR-002)
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "RUF",  # ruff-specific
  "ASYNC",# flake8-async
  "S",    # flake8-bandit (security)
  "BLE",  # flake8-blind-except — enforces engineering rule 6
  "TRY",  # tryceratops — no silent error swallowing
  "ANN",  # flake8-annotations — enforces engineering rule 5
  "SLF", # flake8-self — private access must be deliberate and marked
]
ignore = [
  "ANN401",  # Allow `Any` where it is genuinely unavoidable (e.g. **kwargs passthrough)
  "TRY003",  # Long messages outside exception classes are fine and more readable
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts (that is the point) and need no return annotations.
# S603/S608: the test suite runs Alembic as a subprocess with a fixed argv, and
# builds raw SQL from literals it defines itself, in order to verify that
# database constraints hold for writes that bypass the ORM. Neither takes
# external input.
# S105/S106: test fixtures contain literal passwords by necessity — a
# password-hashing test suite cannot avoid them, and they are not credentials
# for anything.
"tests/**" = ["S101", "ANN201", "ANN001", "S603", "S608", "S105", "S106"]
# flake8-type-checking wants the types used in `Mapped[...]` annotations moved
# into a TYPE_CHECKING block. That breaks the application: SQLAlchemy resolves
# those annotations at class-definition time to derive column types, so a
# type-checking-only import makes the mapping fail outright. Same reason the
# rules are disabled for hcc/api/** (FastAPI's dependency annotations).
"hcc/models/**" = ["TC001", "TC002", "TC003"]
# Alembic generates its own scaffolding style, and migration modules are not
# an importable package.
"alembic/**" = ["ANN201", "ANN001", "INP001", "TC003"]
# flake8-type-checking wants FastAPI's dependency annotations moved into a
# TYPE_CHECKING block. That would break the application: FastAPI resolves
# endpoint annotations at runtime to build the dependency graph, so a
# type-checking-only import makes every route using it fail to register.
"hcc/api/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["hcc"]

# ----------------------------------------------------------------------------
# mypy — static type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
files = ["hcc", "tests"]

[[tool.mypy.overrides]]
# Alembic's generated env/versions files are not worth strict-typing.
module = "alembic.*"
ignore_errors = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires a live PostgreSQL instance (set HCC_TEST_DATABASE_URL)",
]
filterwarnings = ["error"]
