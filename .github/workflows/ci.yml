name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows re-running the pipeline without a new commit.
  workflow_dispatch:

# A new push to a PR cancels the previous run: the old result is irrelevant
# and the runner minutes are not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. No job here writes to the repository.
permissions:
  contents: read

env:
  # Pinned toolchain versions. Kept in one place so an upgrade is a single,
  # reviewable change rather than three scattered edits.
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  GO_VERSION: '1.24'

jobs:
  # ==========================================================================
  # Backend
  # ==========================================================================
  server:
    name: Server (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server

    services:
      # Integration tests run against a real PostgreSQL, not a SQLite stand-in.
      # Testing against a different database than production ships would make
      # the suite's green status misleading.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc_ci
          POSTGRES_DB: hcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcc -d hcc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type-check
        run: mypy

      - name: Run tests
        # HCC_TEST_DATABASE_URL is set, so the integration tests run here
        # rather than skipping. A skipped integration suite in CI is the same
        # as no integration suite.
        env:
          HCC_TEST_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: pytest -v

      - name: Verify migrations apply to an empty database
        # Catches a migration that was committed but never actually run.
        env:
          HCC_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: |
          alembic upgrade head
          alembic current

      - name: Verify migrations are reversible
        env:
          HCC_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify no model changes are missing a migration
        # Fails if someone edits a model without generating a migration, which
        # would otherwise only surface on a colleague's machine.
        env:
          HCC_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: alembic check

  # ==========================================================================
  # Frontend
  # ==========================================================================
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly the lockfile and fails if package.json and
        # the lock have drifted apart.
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ==========================================================================
  # Agent
  # ==========================================================================
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/linux

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # go.mod, not go.sum: the agent has no third-party dependencies, so
          # no go.sum exists and setup-go would fail looking for one.
          cache-dependency-path: agents/linux/go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        # The race detector is not optional for an agent whose core is a
        # concurrent supervision loop.
        run: go test -race -v ./...

      - name: Build
        run: go build -o bin/hcc-agent ./cmd/hcc-agent

      - name: Verify the binary runs
        run: ./bin/hcc-agent -version

      - name: Verify it rejects an empty configuration
        # Exit code 2 means "bad configuration". A binary that started anyway
        # would be a regression in the fail-fast behaviour.
        run: |
          set +e
          ./bin/hcc-agent
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::expected exit code 2 for missing configuration, got $code"
            exit 1
          fi

      - name: Cross-compile for supported targets
        # The agent runs on whatever the homelab owns, so arm64 (Raspberry Pi,
        # Ampere) must keep building.
        run: |
          for target in linux/amd64 linux/arm64 linux/arm; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/hcc-agent
            echo "✓ $target"
          done

  # ==========================================================================
  # Repository hygiene
  # ==========================================================================
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Check for committed secrets
        # A deliberately narrow check for the specific mistake that matters:
        # a real .env file committed alongside the examples.
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "::error::A .env file is committed. Only .env.example belongs in git."
            exit 1
          fi
          echo "✓ No .env files committed"

      - name: Check for private keys
        run: |
          # The pattern is assembled from two fragments so that this file does
          # not contain the literal it searches for, which would make the
          # check match itself on every run.
          pattern='-----BEGIN .*PRIVATE'' KEY-----'
          if git ls-files -z | xargs -0 grep -lE -- "$pattern" 2>/dev/null; then
            echo "::error::A private key appears to be committed."
            exit 1
          fi
          echo "✓ No private keys found"

      - name: Verify every .env.example documents no real secret
        run: |
          status=0
          for f in $(git ls-files '*.env.example'); do
            if ! grep -q 'NEVER' "$f"; then
              echo "::error file=$f::must carry an explicit warning against committing secrets"
              status=1
            fi
          done
          exit $status
