name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows re-running the pipeline without a new commit.
  workflow_dispatch:

# A new push to a PR cancels the previous run: the old result is irrelevant
# and the runner minutes are not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. No job here writes to the repository.
permissions:
  contents: read

env:
  # Pinned toolchain versions. Kept in one place so an upgrade is a single,
  # reviewable change rather than three scattered edits.
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  GO_VERSION: '1.24'

jobs:
  # ==========================================================================
  # Backend
  # ==========================================================================
  server:
    name: Server (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/server

    services:
      # Integration tests run against a real PostgreSQL, not a SQLite stand-in.
      # Testing against a different database than production ships would make
      # the suite's green status misleading.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc_ci
          POSTGRES_DB: hcc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcc -d hcc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type-check
        run: mypy

      - name: Run tests
        # HCC_TEST_DATABASE_URL is set, so the integration tests run here
        # rather than skipping. A skipped integration suite in CI is the same
        # as no integration suite.
        env:
          HCC_TEST_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: pytest -v

      - name: Verify migrations apply to an empty database
        # Catches a migration that was committed but never actually run.
        env:
          HCC_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: |
          alembic upgrade head
          alembic current

      - name: Verify migrations are reversible
        env:
          HCC_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify no model changes are missing a migration
        # Fails if someone edits a model without generating a migration, which
        # would otherwise only surface on a colleague's machine.
        env:
          HCC_DATABASE_URL: postgresql://hcc:hcc_ci@localhost:5432/hcc_test
        run: alembic check

      - name: Verify the OpenAPI snapshot is current
        # The web client's types are validated against this snapshot, so a
        # stale one means the client may be typed against an API that no
        # longer exists. Run from the repository root.
        working-directory: .
        run: ./scripts/openapi-snapshot.sh --check

      - name: Verify the cross-language contracts are current
        # The monitoring module registry exists three times — Python, Go and
        # TypeScript — and the Go and TypeScript copies are tested against
        # this generated file. A stale one means those tests are asserting
        # agreement with a registry that has moved.
        working-directory: .
        run: ./scripts/contracts.sh --check

  # ==========================================================================
  # Frontend
  # ==========================================================================
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # `npm ci` installs exactly the lockfile and fails if package.json and
        # the lock have drifted apart.
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ==========================================================================
  # Agent
  # ==========================================================================
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/linux

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agents/linux/go.sum

      - name: Check formatting
        # ./cmd ./internal, not `.`: the one dependency is vendored, and
        # vendored source is not ours to reformat — a `gofmt -l .` would fail
        # the build over somebody else's line breaks.
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify the vendored dependency matches go.mod
        # `go mod verify` checks the module cache; this checks the *vendored*
        # tree, which is what actually gets compiled. A vendor directory that
        # had drifted from go.mod — or been edited — would otherwise compile
        # silently, which is the whole failure vendoring exists to prevent.
        run: go mod verify && go mod vendor && git diff --exit-code -- vendor go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Run tests
        # The race detector is not optional for an agent whose core is a
        # concurrent supervision loop.
        run: go test -race -v ./...

      - name: Build
        run: go build -o bin/hcc-agent ./cmd/hcc-agent

      - name: Verify the binary runs
        run: ./bin/hcc-agent -version

      - name: Verify it rejects an empty configuration
        # Exit code 2 means "bad configuration". A binary that started anyway
        # would be a regression in the fail-fast behaviour.
        run: |
          set +e
          ./bin/hcc-agent
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::expected exit code 2 for missing configuration, got $code"
            exit 1
          fi

      - name: Cross-compile for supported targets
        # The agent runs on whatever the homelab owns, so arm64 (Raspberry Pi,
        # Ampere) must keep building.
        run: |
          for target in linux/amd64 linux/arm64 linux/arm; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/hcc-agent
            echo "✓ $target"
          done

  # ==========================================================================
  # Release artifacts: built and verified on every change, published by none
  # ==========================================================================
  artifacts:
    name: Artifacts (build and verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agents/linux/go.sum

      - name: Versions agree
        run: ./scripts/check-versions.sh

      - name: Build the artifact set
        # The same script the release workflow runs. A release process whose
        # first execution is the release is not a process.
        run: ./scripts/build-agent-artifacts.sh --clean

      - name: Verify it
        run: ./scripts/verify-artifacts.sh

      - name: Prove the verifier rejects what it claims to
        # Nineteen deliberate corruptions, each of which must be caught by
        # the specific check it is aimed at. Without this the release gate
        # could silently degrade into a gate that passes everything.
        run: ./scripts/verify-artifacts.sh --self-test

      - name: Prove the build is reproducible
        # Two builds, byte-identical. This is what makes the digest the
        # controller pins a statement about the source rather than about one
        # machine.
        run: ./scripts/check-reproducible.sh

      # Deliberately no upload-artifact step. These are built to be checked,
      # not distributed; the release-prepare workflow is where a candidate
      # becomes downloadable.

  # ==========================================================================
  # Smoke test: a real process, on the newest supported Python
  # ==========================================================================
  smoke:
    name: Smoke (real server)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc_local_dev
          POSTGRES_DB: hcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcc -d hcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Deliberately **not** PYTHON_VERSION. The other jobs pin the oldest
          # supported interpreter (3.12), which is the right floor to test
          # against — but development happens on the newest, and a behaviour
          # change there is invisible to a suite that only runs the floor.
          # `make dev-server` was broken for exactly that reason: it passed
          # `--log-config /dev/null`, which 3.14 rejects as an empty file and
          # 3.12 accepts. One job on the ceiling covers that class of break
          # without doubling the whole matrix.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Install the backend
        run: |
          python -m venv apps/server/.venv
          apps/server/.venv/bin/pip install --quiet --upgrade pip
          apps/server/.venv/bin/pip install --quiet -e 'apps/server[dev]'

      - name: Run the smoke test
        # The only gate that starts a real uvicorn process and probes it over
        # HTTP: response headers, the reloading entry point the documentation
        # tells a contributor to use, shutdown, and the configuration
        # refusals. Every other suite talks to the ASGI app in-process.
        run: ./scripts/smoke-test.sh

      - name: Upload the server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure
          path: /tmp/hcc-smoke-*.log
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # The monitoring pipeline, and what survives failure
  # ==========================================================================
  monitoring:
    name: Monitoring (real agent, real /proc)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc_local_dev
          POSTGRES_DB: hcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcc -d hcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Set up Go
        # Both scripts build the agent from source and run it. There is no
        # skip path: an agent that cannot be built is a failure here, because
        # a real agent reading real /proc is the whole point of the job.
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agents/linux/go.sum

      - name: Install the backend
        run: |
          python -m venv apps/server/.venv
          apps/server/.venv/bin/pip install --quiet --upgrade pip
          apps/server/.venv/bin/pip install --quiet -e 'apps/server[dev]'

      - name: The monitoring pipeline, end to end
        # A real controller, a real agent reading the runner's own /proc, a
        # real WebSocket, real rows in real partitions. The suites prove each
        # piece behaves; this proves they agree — including that the
        # configuration checksum the controller computes matches the one the
        # agent computes over the bytes it received, across two languages.
        run: ./scripts/monitoring-e2e.sh

      - name: What survives a failure
        # Kills the controller mid-collection, SIGKILLs the agent, and
        # terminates every database connection. Separate from the above
        # because a green pipeline that loses data on restart is not a green
        # pipeline.
        run: ./scripts/reliability-e2e.sh

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-failure
          path: |
            /tmp/hcc-mon-*.log
            /tmp/hcc-rel-*.log
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # The Compose deployment, from nothing to a working installation
  # ==========================================================================
  deployment:
    name: Deployment (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Build, start, bootstrap, sign in, restart
        # An image building is not evidence of a working deployment, and a
        # Compose file parsing is not evidence that `up -d` produces something
        # you can log in to. This builds the real image from the real
        # Dockerfile, brings the real stack up, runs `hcc bootstrap-admin`
        # through `compose exec`, signs in through the published port, checks
        # the web client is served from the same origin as the API, and
        # restarts the whole thing to prove the volume persists.
        #
        # Docker Compose specifically: podman-compose 1.6.0 hangs on this
        # stack's `depends_on` conditions, so the script skips rather than
        # hanging when Docker is absent — which means this job is the only
        # place it actually runs.
        run: ./scripts/deployment-e2e.sh

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-failure
          path: /tmp/hcc-deploy-*/
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # The installation lifecycle, against real systemd
  # ==========================================================================
  install-matrix:
    name: Install (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every distribution runs even when one fails. "It works on Debian and
      # not on Fedora" is the finding; cancelling the others would hide half
      # of it.
      fail-fast: false
      matrix:
        image: ['debian:13', 'ubuntu:24.04', 'fedora:42']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc_local_dev
          POSTGRES_DB: hcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcc -d hcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agents/linux/go.sum

      - name: Install the backend
        run: |
          python -m venv apps/server/.venv
          apps/server/.venv/bin/pip install --quiet --upgrade pip
          apps/server/.venv/bin/pip install --quiet -e 'apps/server[dev]'

      - name: Install, collect, diagnose, upgrade, roll back, uninstall
        # A privileged container with systemd as pid 1, a real controller
        # behind real TLS with a real internal CA, and the actual `hcc-agent
        # install` command a person would paste.
        #
        # This is the job that proves the hardened unit *works* rather than
        # merely parses. `systemd-analyze verify` does not execute anything,
        # and the unit carried `ProcSubset=pid` for several milestones — which
        # hides every /proc file the agent reads, so the service would have
        # started, connected, reported itself healthy and collected nothing.
        # Step 10 of the script enables a module and asserts a row appears.
        run: ./scripts/install-matrix.sh --image '${{ matrix.image }}'

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-matrix-${{ strategy.job-index }}
          path: /tmp/hcc-inst-*.log
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # Browser end-to-end
  # ==========================================================================
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # A real PostgreSQL: `scripts/e2e.sh` creates its own disposable
      # database inside it, so nothing here shares state with the other jobs.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hcc
          POSTGRES_PASSWORD: hcc_local_dev
          POSTGRES_DB: hcc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcc -d hcc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Go
        # The browser journey drives the *real* agent, built by
        # scripts/e2e.sh. Without a toolchain the live-host tests would skip,
        # which is why E2E_REQUIRE_AGENT below turns a missing agent into a
        # failure here rather than a silent gap.
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: agents/linux/go.sum

      - name: Install the backend
        # Into the venv path scripts/e2e.sh expects, so the script is the same
        # one a developer runs rather than a CI-only variant.
        run: |
          python -m venv apps/server/.venv
          apps/server/.venv/bin/pip install --quiet --upgrade pip
          apps/server/.venv/bin/pip install --quiet -e 'apps/server[dev]'

      - name: Install the frontend
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        # --with-deps pulls the system libraries a headless browser needs on a
        # bare runner.
        run: npx playwright install --with-deps chromium

      - name: Run the browser journey
        # Stands up a disposable installation, builds the client and the
        # agent, serves the client with the /api proxy, and drives the whole
        # thing with a real browser.
        env:
          # A missing agent binary is a failure here, not a skip. The host
          # journey is this milestone's deliverable, and a CI run that
          # silently stopped exercising it would be worse than no CI run.
          E2E_REQUIRE_AGENT: '1'
        run: ./scripts/e2e.sh

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            apps/web/test-results/
            /tmp/hcc-e2e-*.log
          retention-days: 7
          if-no-files-found: ignore

  # ==========================================================================
  # Repository hygiene
  # ==========================================================================
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Check for committed secrets
        # A deliberately narrow check for the specific mistake that matters:
        # a real .env file committed alongside the examples.
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production)$'; then
            echo "::error::A .env file is committed. Only .env.example belongs in git."
            exit 1
          fi
          echo "✓ No .env files committed"

      - name: Check for private keys
        run: |
          # The pattern is assembled from two fragments so that this file does
          # not contain the literal it searches for, which would make the
          # check match itself on every run.
          pattern='-----BEGIN .*PRIVATE'' KEY-----'
          if git ls-files -z | xargs -0 grep -lE -- "$pattern" 2>/dev/null; then
            echo "::error::A private key appears to be committed."
            exit 1
          fi
          echo "✓ No private keys found"

      - name: Check for key, certificate and database-dump files
        # The step above reads file *contents*. This one reads file *names*,
        # which catches the binary formats that carry a key without the PEM
        # header — a .p12 or a .jks greps as noise — and the database dumps
        # the backup documentation tells operators to create. A `pg_dump` of
        # this application is every password hash and credential digest in it.
        run: |
          matches=$(git ls-files | grep -E '\.(pem|key|crt|cer|p12|pfx|jks|dump|sqlite3?)$|(^|/)id_(rsa|ecdsa|ed25519)' \
                    | grep -v -E 'testdata/' || true)
          if [ -n "$matches" ]; then
            echo "::error::Files that should never be committed are tracked:"
            echo "$matches"
            exit 1
          fi
          echo "✓ No key, certificate or dump files tracked"

      - name: Check documentation
        # The docs carry the architecture and security model and cross-link
        # heavily; a broken link silently turns a documented decision into an
        # undocumented one.
        run: ./scripts/check-docs.sh

      - name: Check version consistency
        # Four files carry the version and release artifacts are named from
        # one of them. A mismatch makes the download URL in the install
        # command point at a release that was never published.
        run: ./scripts/check-versions.sh

      - name: Verify every .env.example documents no real secret
        run: |
          status=0
          for f in $(git ls-files '*.env.example'); do
            if ! grep -q 'NEVER' "$f"; then
              echo "::error file=$f::must carry an explicit warning against committing secrets"
              status=1
            fi
          done
          exit $status
